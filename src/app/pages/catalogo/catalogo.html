<div class="titulo-container">

  <div class="linea"></div>

  <h2 class="titulo">
    CATÁLOGO DE PRODUCTOS
  </h2>

  <div class="linea"></div>

</div>

<div class="catalogo-container">

  <div class="producto-card" *ngFor="let producto of productos">

    <div class="producto-id">
      ID: {{producto.id}}
    </div>

    <h3 class="producto-nombre">
      {{producto.name}}
    </h3>

    <div class="producto-info">
      <p>💰 Precio: {{producto.precio}}</p>
      <p>📦 Stock: {{producto.Stock}}</p>
    </div>

    <div class="acciones">

      <button class="btn-descontar"
      (click)="descontar(producto.id)">
        ➖ Descontar
      </button>

      <button class="btn-reponer"
      (click)="reponer(producto.id)">
        ➕ Reponer
      </button>

    </div>

  </div>

</div>
