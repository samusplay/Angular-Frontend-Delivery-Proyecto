<div class="titulo-container">
  <div class="linea"></div>
  <h2 class="titulo">CATÁLOGO DE PRODUCTOS</h2>
  <div class="linea"></div>
</div>

<div class="tabla-container">

<table class="tabla-catalogo">

<thead class="table-header">
<tr>
<th>ID</th>
<th>Producto</th>
<th>Precio</th>
<th>Stock</th>
<th class="acciones-header">Acciones</th>
</tr>
</thead>

<tbody>

<tr *ngFor="let producto of productos">

<td class="id">{{producto.id}}</td>
<td class="nombre">{{producto.name}}</td>
<td class="precio">$ {{producto.precio}}</td>
<td class="stock">{{producto.Stock}}</td>

<td class="acciones">

<button class="btn-descontar"
(click)="descontar(producto.id)">
➖ Descontar
</button>

<button class="btn-reponer"
(click)="reponer(producto.id)">
➕ Reponer
</button>

</td>

</tr>

</tbody>

</table>

</div>
